<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Síntese — endereço novo</title>
<!-- A síntese foi incorporada à página inicial (rodada A2). Com ?cota= de uma das manchas publicadas, vai
     para a tela da cheia e saúde com a cota; sem cota (ou com cota que não existe), vai para a página inicial.
     Os demais parâmetros e o # seguem junto. -->
<link rel="canonical" href="../index.html">
<script>
(function(){
  var q = new URLSearchParams(location.search), cota = q.get('cota'), h = location.hash;
  function ir(destino){ var s = q.toString(); location.replace(destino + (s ? '?' + s : '') + h); }
  function inicio(){ q.delete('cota'); ir('../index.html'); }
  if(!cota){ ir('../index.html'); return; }
  // a cota é conferida contra as manchas publicadas (mesmo produto que a tela da cheia lê)
  fetch('../data/paineis/inundacao_sgb_cotas.json')
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ if(j.dados.some(function(r){ return String(r.cota_cm) === cota; })) ir('cheia-saude.html'); else inicio(); })
    .catch(function(){ if(/^\d+$/.test(cota)) ir('cheia-saude.html'); else inicio(); });
})();
</script>
</head>
<body>
<p>A síntese agora está na <a href="../index.html">página inicial</a>. A cheia e o acesso à saúde estão em <a href="cheia-saude.html">cheia e saúde</a>.</p>
</body>
</html>
